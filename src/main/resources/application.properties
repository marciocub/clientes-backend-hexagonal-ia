spring.application.name=clientes-hexagonal

# --- Base de datos MySQL (Docker: contenedor mysql-app-clientes-hexagonal, puerto host 3309) ---
spring.datasource.url=jdbc:mysql://localhost:3309/clientes_hexago_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate (las tablas se crean/actualizan al arrancar) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CORS para el frontend React ---
spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# --- JWT (firmado HS256) ---
app.jwt.secret=tu-clave-secreta-super-segura-cambiar-en-produccion-1234567890
app.jwt.expiration=86400000

# --- Puerto del backend ---
server.port=8080
